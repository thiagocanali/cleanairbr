name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Validar e publicar Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Necessário apenas para publicar na branch gh-pages
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependências reproduzíveis
        run: npm ci
      - name: Executar testes antes de publicar
        run: npm test
      - name: Compilar antes de publicar
        run: npm run build
      - name: Publicar somente após validação
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
